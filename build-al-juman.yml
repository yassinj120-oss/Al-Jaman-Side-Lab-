name: Build Al-Juman Lab APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 4. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      # 5. Find or extract Android project
      - name: Locate Android project
        shell: bash
        run: |
          python3 <<'PY'
          import os
          import zipfile
          from pathlib import Path, PurePosixPath

          root = Path.cwd()

          def find_projects():
              found = []

              for current, dirs, files in os.walk(root):
                  dirs[:] = [
                      d for d in dirs
                      if d not in ('.git', '.gradle', 'build')
                  ]

                  p = Path(current)
                  has_settings = (
                      'settings.gradle' in files or
                      'settings.gradle.kts' in files
                  )
                  has_app = (
                      (p / 'app' / 'build.gradle').is_file() or
                      (p / 'app' / 'build.gradle.kts').is_file()
                  )

                  if has_settings and has_app:
                      found.append(p)

              return sorted(found, key=lambda p: (len(p.parts), str(p)))

          projects = find_projects()

          if not projects:
              zips = sorted(root.glob('*.zip'))

              if not zips:
                  raise SystemExit('ERROR: No Android project or ZIP found.')

              archive = next(
                  (z for z in zips if 'Build-Ready' in z.name),
                  zips[0]
              )

              target = root / '_ci_source'
              target.mkdir(exist_ok=True)
              print('Extracting:', archive.name)

              with zipfile.ZipFile(archive) as z:
                  for item in z.infolist():
                      name = PurePosixPath(item.filename)
                      if (
                          name.is_absolute()
                          or '..' in name.parts
                          or '\\' in item.filename
                      ):
                          continue
                      z.extract(item, target)

              projects = find_projects()

          if not projects:
              raise SystemExit('ERROR: Android app module not found.')

          project = projects[0].resolve()
          print('Selected Android project:', project)

          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              env.write(f'PROJECT_DIR={project}\n')
          PY

      # 6. Apply updated laboratory application interface
      - name: Update Lab Application Interface
        shell: bash
        run: |
          set -euo pipefail

          SOURCE="$GITHUB_WORKSPACE/index.html"
          TARGET="$PROJECT_DIR/app/src/main/assets/index.html"

          if [ ! -f "$SOURCE" ]; then
            echo "ERROR: index.html was not found in the repository root."
            echo "Upload the updated index.html beside the project files."
            exit 1
          fi

          mkdir -p "$(dirname "$TARGET")"
          cp "$SOURCE" "$TARGET"

          test -s "$TARGET"
          echo "Updated application interface copied successfully."

      # 7. Install required Android SDK platform
      - name: Install Android SDK platform
        shell: bash
        run: |
          set -euo pipefail

          COMPILE_SDK=$(python3 - "$PROJECT_DIR" <<'PY'
          import re
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          values = []

          for pattern in ('build.gradle', 'build.gradle.kts'):
              for file in root.rglob(pattern):
                  if 'build' in file.parts:
                      continue
                  text = file.read_text(errors='ignore')
                  matches = re.findall(
                      r'compileSdk(?:Version)?\s*[=(]?\s*(\d+)',
                      text
                  )
                  values.extend(int(x) for x in matches)

          print(max(values) if values else 35)
          PY
          )

          echo "Installing Android API $COMPILE_SDK"
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-${COMPILE_SDK}"

      # 8. Fix Java and Kotlin JVM compatibility
      - name: Fix Java and Kotlin compatibility
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/java17.init.gradle" <<'GRADLE'
          gradle.projectsEvaluated {
              allprojects { project ->
                  def androidExtension = project.extensions.findByName("android")

                  if (androidExtension != null) {
                      androidExtension.compileOptions.sourceCompatibility =
                          JavaVersion.VERSION_17
                      androidExtension.compileOptions.targetCompatibility =
                          JavaVersion.VERSION_17
                  }

                  project.tasks.withType(
                      org.gradle.api.tasks.compile.JavaCompile
                  ).configureEach {
                      sourceCompatibility = '17'
                      targetCompatibility = '17'
                  }

                  project.tasks.configureEach { task ->
                      if (task.class.name.contains('KotlinCompile')) {
                          try {
                              if (task.hasProperty('kotlinOptions')) {
                                  task.kotlinOptions.jvmTarget = '17'
                              }
                          } catch (Exception ignored) {
                              println("Kotlin JVM target handled by project configuration")
                          }
                      }
                  }
              }
          }
          GRADLE

      # 9. Build Debug APK
      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew \
              --no-daemon \
              --stacktrace \
              --init-script "$RUNNER_TEMP/java17.init.gradle" \
              assembleDebug
          else
            gradle \
              --no-daemon \
              --stacktrace \
              --init-script "$RUNNER_TEMP/java17.init.gradle" \
              assembleDebug
          fi

      # 10. Verify APK
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            | sort \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/final-apk"
          cp "$APK" "$RUNNER_TEMP/final-apk/Al-Juman-Lab.apk"
          echo "APK verified successfully."

      # 11. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Al-Juman-Lab-APK
          path: ${{ runner.temp }}/final-apk/Al-Juman-Lab.apk
          if-no-files-found: error
          retention-days: 30
