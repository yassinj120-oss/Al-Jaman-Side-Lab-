
name: Build Al-Juman Lab APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          unzip -q Al-Juman-Android-Build-Ready.zip -d /tmp/aljuman
          cp -a /tmp/aljuman/AlJumanAndroid/. .

      - name: Fix Java target compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle")
          s = p.read_text()
          old = "JavaVersion.VERSION_1_8"
          if old not in s:
              raise SystemExit("Java 1.8 setting not found")
          s = s.replace(old, "JavaVersion.VERSION_17")
          p.write_text(s)
          print("Java target updated to 17")
          PY


      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Al-Juman-Lab-APK.
          path: app/build/outputs/apk/debug/app-debug.apk
