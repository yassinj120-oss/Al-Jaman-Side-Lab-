name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"

      - name: Locate Android Project
        shell: bash
        run: |
          if [ -f "gradlew" ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          elif [ -f "android/gradlew" ]; then
            echo "PROJECT_DIR=android" >> "$GITHUB_ENV"
          else
            echo "ERROR: Gradle wrapper not found"
            exit 1
          fi

      - name: Make Gradle Wrapper Executable
        run: |
          chmod +x gradlew 2>/dev/null || true
          chmod +x android/gradlew 2>/dev/null || true

      - name: Fix Java and Kotlin JVM Target
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/jvm17.init.gradle" <<'GRADLE'
          import org.gradle.api.tasks.compile.JavaCompile

          allprojects {
              tasks.withType(JavaCompile).configureEach {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
                  options.release = 17
              }

              tasks.configureEach {
                  if (hasProperty("kotlinOptions")) {
                      try {
                          kotlinOptions.jvmTarget = "17"
                      } catch (Exception ignored) {
                      }
                  }
              }
          }
          GRADLE

      - name: Build Debug APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon --stacktrace \
            -I "$RUNNER_TEMP/jvm17.init.gradle" \
            assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "APK file not found!"
            exit 1
          fi
          echo "APK successfully created:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Al-Juman-Lab-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
