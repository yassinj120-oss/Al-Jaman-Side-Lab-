name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Locate Android Project
        shell: bash
        run: |
          if [ ! -f "gradlew" ] && [ -f "android/gradlew" ]; then
            echo "PROJECT_DIR=android" >> "$GITHUB_ENV"
          elif [ -f "gradlew" ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          else
            echo "ERROR: gradlew not found"
            exit 1
          fi

      - name: Make Gradle Wrapper Executable
        run: |
          if [ -f gradlew ]; then chmod +x gradlew; fi
          if [ -f android/gradlew ]; then chmod +x android/gradlew; fi

      - name: Fix Java and Kotlin JVM Target Compatibility
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/jvm17.init.gradle" <<'GRADLE'
          import org.gradle.api.tasks.compile.JavaCompile

          allprojects {
              tasks.withType(JavaCompile).configureEach {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
                  options.release = 17
              }

              tasks.configureEach { task ->
                  if (task.class.name.toLowerCase().contains('kotlin')) {
                      try {
                          task.kotlinOptions.jvmTarget = '17'
                      } catch (Exception ignored) {
                          try {
                              task.compilerOptions.jvmTarget.set(
                                  org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
                              )
                          } catch (Exception ignored2) {
                          }
                      }
                  }
              }
          }
          GRADLE

      - name: Build Debug APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon --stacktrace \
            -I "$RUNNER_TEMP/jvm17.init.gradle" \
            assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          echo "APK successfully created:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Al-Juman-Lab-debug-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
