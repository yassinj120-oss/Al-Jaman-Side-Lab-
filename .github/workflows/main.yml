name: Build Al-Juman Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare Android Project
        shell: bash
        run: |
          set -e

          mkdir -p build-project

          ZIP_FILE=$(find . -maxdepth 3 -type f \
            -iname "*.zip" | head -n 1)

          if [ -n "$ZIP_FILE" ]; then
            echo "Extracting project ZIP..."
            unzip -q "$ZIP_FILE" -d build-project
          else
            echo "Using repository files..."
            cp -R . build-project/
          fi

          PROJECT_ROOT=$(find build-project -type f \
            \( -name "settings.gradle" -o \
               -name "settings.gradle.kts" \) \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_ROOT" ]; then
            echo "Searching repository for Android project..."
            PROJECT_ROOT=$(find . -type f \
              \( -name "settings.gradle" -o \
                 -name "settings.gradle.kts" \) \
              -print -quit | xargs -r dirname)
          fi

          if [ -z "$PROJECT_ROOT" ]; then
            echo "ERROR: Android project not found."
            find . -maxdepth 4 -type f
            exit 1
          fi

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

          echo "Project located at:"
          echo "$PROJECT_ROOT"

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"

      - name: Install Android SDK Packages
        shell: bash
        run: |
          set -e

          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER=$(find /usr/local/lib/android/sdk \
              -type f -name sdkmanager -print -quit)
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Prepare Gradle Wrapper
        shell: bash
        run: |
          set -e

          cd "$PROJECT_ROOT"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          else
            gradle wrapper --gradle-version 8.9
            chmod +x ./gradlew
          fi

      - name: Fix Java and Kotlin JVM Target
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/jvm17.init.gradle" <<'GRADLE'
          import org.gradle.api.tasks.compile.JavaCompile

          allprojects {
              tasks.withType(JavaCompile).configureEach {
                  sourceCompatibility = "17"
                  targetCompatibility = "17"
              }

              tasks.configureEach { task ->
                  if (task.hasProperty("kotlinOptions")) {
                      try {
                          task.kotlinOptions.jvmTarget = "17"
                      } catch (Exception ignored) {
                      }
                  }
              }
          }
          GRADLE

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_ROOT"

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --init-script "$RUNNER_TEMP/jvm17.init.gradle" \
            assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK_FILE=$(find "$PROJECT_ROOT" -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -print -quit)

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK not found."
            exit 1
          fi

          echo "APK successfully created:"
          ls -lh "$APK_FILE"

          echo "APK_FILE=$APK_FILE" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Al-Juman-Lab-APK
          path: ${{ env.APK_FILE }}
          if-no-files-found: error
          retention-days: 14
