name: Build Al-Juman Lab APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Download repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 4. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 5. Locate or extract Android project
      - name: Locate Android project
        shell: bash
        run: |
          python3 <<'PY'
          import os
          import zipfile
          from pathlib import Path

          root = Path.cwd()

          def find_projects():
              found = []
              for current, dirs, files in os.walk(root):
                  dirs[:] = [
                      d for d in dirs
                      if d not in ('.git', '.gradle', 'build')
                  ]
                  p = Path(current)
                  if ('settings.gradle' in files or
                      'settings.gradle.kts' in files):
                      if ((p / 'app' / 'build.gradle').exists() or
                          (p / 'app' / 'build.gradle.kts').exists()):
                          found.append(p)
              return found

          projects = find_projects()

          if not projects:
              zips = list(root.glob('*.zip'))
              if not zips:
                  raise SystemExit(
                      'ERROR: No Android project or ZIP archive found.'
                  )

              archive = next(
                  (z for z in zips if 'Build-Ready' in z.name),
                  zips[0]
              )

              target = root / '_ci_source'
              target.mkdir(exist_ok=True)

              with zipfile.ZipFile(archive) as z:
                  for item in z.infolist():
                      name = Path(item.filename)
                      if name.is_absolute() or '..' in name.parts:
                          continue
                      z.extract(item, target)

              projects = find_projects()

          if not projects:
              raise SystemExit(
                  'ERROR: Android project with app module not found.'
              )

          project = projects[0]
          print('Android project:', project)
          Path(os.environ['GITHUB_ENV']).write_text(
              f'PROJECT_DIR={project}\n'
          )
          PY

      # 6. Install required Android platform
      - name: Install Android SDK platform
        shell: bash
        run: |
          COMPILE_SDK=$(python3 - "$PROJECT_DIR" <<'PY'
          import re
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          values = []

          for file in root.rglob('*.gradle'):
              if 'build' in file.parts:
                  continue
              text = file.read_text(errors='ignore')
              matches = re.findall(
                  r'compileSdk(?:Version)?\s*[=(]?\s*(\d+)',
                  text
              )
              values.extend(int(x) for x in matches)

          for file in root.rglob('*.gradle.kts'):
              text = file.read_text(errors='ignore')
              matches = re.findall(
                  r'compileSdk(?:Version)?\s*[=(]?\s*(\d+)',
                  text
              )
              values.extend(int(x) for x in matches)

          print(max(values) if values else 35)
          PY
          )

          echo "Installing Android API $COMPILE_SDK"

          yes | sdkmanager --licenses

          sdkmanager \
            "platform-tools" \
            "platforms;android-${COMPILE_SDK}"

      # 7. Fix Java and Kotlin target compatibility
      - name: Fix Java and Kotlin compatibility
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/java17.init.gradle" <<'GRADLE'
          gradle.projectsEvaluated {
              allprojects {
                  tasks.withType(
                      org.gradle.api.tasks.compile.JavaCompile
                  ).configureEach {
                      sourceCompatibility = '17'
                      targetCompatibility = '17'
                  }

                  tasks.configureEach { task ->
                      if (task.class.name.contains('KotlinCompile')) {
                          try {
                              task.kotlinOptions.jvmTarget = '17'
                          } catch (Exception ignored) {
                              println(
                                  "Kotlin target configuration skipped"
                              )
                          }
                      }
                  }
              }
          }
          GRADLE

      # 8. Build APK
      - name: Build Debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew \
              --no-daemon \
              --stacktrace \
              --init-script "$RUNNER_TEMP/java17.init.gradle" \
              assembleDebug
          else
            gradle \
              --no-daemon \
              --stacktrace \
              --init-script "$RUNNER_TEMP/java17.init.gradle" \
              assembleDebug
          fi

      # 9. Verify APK
      - name: Verify APK
        shell: bash
        run: |
          APK=$(find "$PROJECT_DIR" \
            -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK file was not generated."
            exit 1
          fi

          echo "APK successfully generated: $APK"
          mkdir -p "$RUNNER_TEMP/final-apk"
          cp "$APK" "$RUNNER_TEMP/final-apk/Al-Juman-Lab.apk"

      # 10. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Al-Juman-Lab-APK
          path: ${{ runner.temp }}/final-apk/Al-Juman-Lab.apk
          if-no-files-found: error
          retention-days: 30
