name: إنشاء ملف APK لنظام Android

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Locate Android project
        shell: bash
        run: |
          if [ ! -f ./gradlew ]; then
            echo "gradlew not found at repository root"
            find . -maxdepth 4 -name gradlew -print
            exit 1
          fi
          chmod +x ./gradlew

      - name: Force Java and Kotlin targets to 17
        shell: bash
        run: |
          cat > jvm17.init.gradle <<'GRADLE'
          allprojects {
            afterEvaluate { p ->
              def androidExt = p.extensions.findByName('android')
              if (androidExt != null && androidExt.hasProperty('compileOptions')) {
                androidExt.compileOptions.sourceCompatibility = JavaVersion.VERSION_17
                androidExt.compileOptions.targetCompatibility = JavaVersion.VERSION_17
              }
              p.tasks.withType(JavaCompile).configureEach {
                sourceCompatibility = '17'
                targetCompatibility = '17'
              }
              p.tasks.configureEach { task ->
                if (task.hasProperty('kotlinOptions')) {
                  task.kotlinOptions.jvmTarget = '17'
                }
              }
            }
          }
          GRADLE

      - name: Build Debug APK
        run: ./gradlew --init-script jvm17.init.gradle assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          APK=$(find . -type f -path '*/build/outputs/apk/debug/*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "APK not found after build"
            exit 1
          fi
          echo "APK found: $APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Al-Juman-Lab-Debug-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
